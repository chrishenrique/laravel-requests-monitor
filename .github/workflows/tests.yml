name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} (${{ matrix.stability || 'prefer-stable' }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: 7,  testbench: 5,  dbal: '^2.13', php: '7.4' }
          - { laravel: 8,  testbench: 6,  dbal: '^2.13', php: '7.4' }
          - { laravel: 8,  testbench: 6,  dbal: '^2.13', php: '8.1' }
          - { laravel: 9,  testbench: 7,  dbal: '^3.5', php: '8.0' }
          - { laravel: 9,  testbench: 7,  dbal: '^3.5', php: '8.2' }
          - { laravel: 10, testbench: 8,  dbal: '^3.5', php: '8.1' }
          - { laravel: 10, testbench: 8,  dbal: '^3.5', php: '8.3' }
          - { laravel: 11, testbench: 9,  dbal: '^4.0', php: '8.2' }
          - { laravel: 11, testbench: 9,  dbal: '^4.0', php: '8.4' }
          - { laravel: 12, testbench: 10, dbal: '^4.0', php: '8.2' }
          - { laravel: 12, testbench: 10, dbal: '^4.0', php: '8.5' }
          - { laravel: 13, testbench: 11, dbal: '^4.0', php: '8.3' }
          - { laravel: 13, testbench: 11, dbal: '^4.0', php: '8.5' }
          # Garante que as versões mínimas aceitas pelo composer.json também funcionam
          - { laravel: 13, testbench: 11, dbal: '^4.0', php: '8.3', stability: prefer-lowest }

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, pdo, pdo_sqlite, sqlite3
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ matrix.stability || 'prefer-stable' }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-php${{ matrix.php }}-laravel${{ matrix.laravel }}-

      # Composer 2.9+ bloqueia releases com advisories de segurança, o que faria o
      # Laravel 7/8/9 cair no branch x-dev. Aqui queremos testar as releases reais.
      - name: Allow releases with security advisories
        run: composer config audit.block-insecure false

      - name: Install dependencies
        run: |
          composer update --${{ matrix.stability || 'prefer-stable' }} --prefer-dist --no-interaction --no-progress \
            --with "laravel/framework:^${{ matrix.laravel }}.0" \
            --with "orchestra/testbench:^${{ matrix.testbench }}.0" \
            --with "doctrine/dbal:${{ matrix.dbal }}"

      - name: Installed versions
        run: composer show laravel/framework orchestra/testbench phpunit/phpunit | grep -E '^(name|versions)'

      - name: Run tests
        run: vendor/bin/phpunit --no-coverage
